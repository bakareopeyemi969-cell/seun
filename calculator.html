<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javascript Assignment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a2332;
      margin: 0;
    }

    .navbar {
      background: #0f172a;
      border-bottom: 1px solid #334155;
      padding: 1rem 3%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.25rem;
      color: white;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #f7df1e;
      color: #000;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: monospace;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #38bdf8;
    }

    .calc-card {
      background: #243044;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .op-btn {
      padding: 14px;
      font-size: 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      font-weight: 700;
    }

    .add { background: #22c55e; }
    .sub { background: #3b82f6; }
    .mul { background: #ec4899; }
    .div { background: #06b6d4; }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon">JS</div>
        JavaScript
      </div>
      <ul class="nav-links">
        <li><a href="index.html">History</a></li>
        <li><a href="documentation.html">Documentations</a></li>
        <li><a href="calculator.html" class="active">Calculator</a></li>
      </ul>
    </div>
  </nav>

  
    <div class="w-full max-w-6xl mx-auto grid md:grid-cols-2 gap-6">
      
      
      <div class="calc-card">
        <h2 class="text-xl font-semibold text-cyan-400 mb-6 text-center">Simple Calculator</h2>
        
        <div class="flex justify-center items-center gap-3 mb-5">
          <input type="number" id="num1" value="" 
            class="w-20 px-3 py-2 bg-slate-900 border-2 border-slate-600 rounded-lg text-white text-lg text-center">
          <span id="current-op" class="text-white text-xl font-bold">+</span>
          <input type="number" id="num2" value="" 
            class="w-20 px-3 py-2 bg-slate-900 border-2 border-slate-600 rounded-lg text-white text-lg text-center">
        </div>

        <p class="text-white text-center mb-3 font-medium">Operators</p>
        <div class="grid grid-cols-2 gap-3 mb-5">
          <button class="op-btn add" onclick="doSum()">+</button>
          <button class="op-btn sub" onclick="doSub()">−</button>
          <button class="op-btn mul" onclick="doMul()">×</button>
          <button class="op-btn div" onclick="doDiv()">÷</button>
        </div>

        <div id="result" class="bg-cyan-400 text-slate-900 px-3 py-2 rounded text-sm font-medium text-center hidden">
        </div>
      </div>

      
      <div class="calc-card">
        <h2 class="text-xl font-semibold text-cyan-400 mb-6 text-center">Retirement Calculator</h2>
        
        <div class="flex gap-2 mb-4">
          <input 
            type="number" 
            id="birthYear" 
            placeholder="Enter your birth year" 
            value="1965"
            class="flex-1 px-4 py-3 bg-slate-900 border-2 border-slate-600 rounded-lg text-white text-base"
          >
          <button 
            onclick="checkRetirement()" 
            class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg"
          >
            Check
          </button>
        </div>
        
        <p class="text-white text-center mb-2">Retire:</p>
        <div id="retirementResult" class="bg-cyan-400 text-slate-900 px-3 py-2 rounded text-sm font-medium text-center hidden">
        </div>
      </div>

    </div>
  </div>

  <script>
    // SIMPLE CALCULATOR 
    function doSum() {
      var a = document.getElementById("num1").value;
      var b = document.getElementById("num2").value;
      var result = parseFloat(a) + parseFloat(b);
      
      document.getElementById("current-op").innerHTML = "+";
      
      if (isNaN(result)) {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "Please enter numbers";
      } else {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "The sum of " + a + " and " + b + " is " + result;
      }
    }

    function doSub() {
      var a = document.getElementById("num1").value;
      var b = document.getElementById("num2").value;
      var result = parseFloat(a) - parseFloat(b);
      
      document.getElementById("current-op").innerHTML = "-";
      
      if (isNaN(result)) {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "Please enter numbers";
      } else {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "The difference of " + a + " and " + b + " is " + result;
      }
    }

    function doMul() {
      var a = document.getElementById("num1").value;
      var b = document.getElementById("num2").value;
      var result = parseFloat(a) * parseFloat(b);
      
      document.getElementById("current-op").innerHTML = "×";
      
      if (isNaN(result)) {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "Please enter numbers";
      } else {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "The product of " + a + " and " + b + " is " + result;
      }
    }

    function doDiv() {
      var a = document.getElementById("num1").value;
      var b = document.getElementById("num2").value;
      
      document.getElementById("current-op").innerHTML = "÷";
      
      if (b == 0) {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "Cannot divide by zero";
      } else if (isNaN(a) || isNaN(b)) {
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "Please enter numbers";
      } else {
        var result = parseFloat(a) / parseFloat(b);
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("result").innerHTML = "The quotient of " + a + " and " + b + " is " + result;
      }
    }

    // RETIREMENT CALCULATOR 
    function checkRetirement() {
      var birthYear = document.getElementById("birthYear").value;
      var currentYear = 2026;
      var retirementAge = 65;
      
      var age = currentYear - birthYear;
      var yearsLeft = retirementAge - age;
      
      if (birthYear == "") {
        document.getElementById("retirementResult").classList.remove("hidden");
        document.getElementById("retirementResult").innerHTML = "Please enter your birth year";
      } else if (birthYear > currentYear) {
        document.getElementById("retirementResult").classList.remove("hidden");
        document.getElementById("retirementResult").innerHTML = "Birth year cannot be in the future";
      } else if (yearsLeft == 0) {
        document.getElementById("retirementResult").classList.remove("hidden");
        document.getElementById("retirementResult").innerHTML = "You are " + age + " years old, you can retire now";
      } else if (yearsLeft == 1) {
        document.getElementById("retirementResult").classList.remove("hidden");
        document.getElementById("retirementResult").innerHTML = "You are " + age + " years old, you will retire next year";
      } else if (yearsLeft == -1) {
        document.getElementById("retirementResult").classList.remove("hidden");
        document.getElementById("retirementResult").innerHTML = "You are " + age + " years old, you supposed to have retired 1 years ago";
      } else if (yearsLeft < -1) {
        var yearsOver = yearsLeft * -1;
        document.getElementById("retirementResult").classList.remove("hidden");
        document.getElementById("retirementResult").innerHTML = "You are " + age + " years old, you supposed to have retired " + yearsOver + " years ago";
      } else {
        document.getElementById("retirementResult").classList.remove("hidden");
        document.getElementById("retirementResult").innerHTML = "You are " + age + " years old, remain " + yearsLeft + " more years for you to retire";
      }
    }
  </script>
</body>
</html>
